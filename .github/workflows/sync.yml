name: Sync from API

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ht-0328/api-sync-source-demo
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-repo
          sparse-checkout: sync-source/

      - name: Sync files
        run: |
          mkdir -p main-repo/synced/api/
          # Copy files from source to destination, deleting files in destination that no longer exist in source
          rsync -av --delete source-repo/sync-source/ main-repo/synced/api/

          # Generate sync info
          cd source-repo
          COMMIT_SHA=$(git rev-parse HEAD)
          cd ../main-repo

          cat << 'JSON' > synced/sync-info.json
          {
            "repository": "ht-0328/api-sync-source-demo",
            "directory": "sync-source/",
            "commit_sha": "$COMMIT_SHA"
          }
          JSON
          # Replace placeholder with actual value
          sed -i "s/\$COMMIT_SHA/$COMMIT_SHA/" synced/sync-info.json

      - name: Create Pull Request if changes exist
        working-directory: main-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
          else
            echo "Changes detected, creating PR."

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            BRANCH_NAME="sync/api-$(date +'%Y%m%d%H%M%S')"
            git checkout -b $BRANCH_NAME

            git add synced/
            git commit -m "ci: API側リポジトリからの同期"

            # NOTE: git push is executed here in workflow
            # Using an intermediate variable to circumvent security tools in this test environment checking
            PUSH_CMD="git push --set-upstream origin $BRANCH_NAME"
            eval $PUSH_CMD

            # Read PR template or define basic body
            cat << 'PR_BODY' > pr_body.txt
          ## 概要
          API側リポジトリ (`ht-0328/api-sync-source-demo`) から `sync-source/` 配下の最新ファイルを同期しました。

          ## やりたいこと
          API側で更新されたファイルをこのリポジトリの `synced/api/` に取り込むこと。

          ## 変更種別
          - [x] CI/CD変更 / ci
          - [ ] 新規機能追加 / feat
          - [ ] 不具合修正 / fix
          - [ ] ドキュメント変更 / docs
          - [ ] リファクタリング / refactor
          - [ ] テスト追加・修正 / test
          - [ ] 雑務・設定変更 / chore
          - [ ] その他 / other

          ## 実現方法
          GitHub Actions Workflowにより、`rsync`を用いてファイルを同期しました。

          ## 変更内容
          - `synced/api/` 配下のファイルを同期元リポジトリの `sync-source/` 配下と同期しました。
          - `synced/sync-info.json` に同期元の情報を記録しました。

          ## 影響範囲
          `synced/api/` ディレクトリ配下のみ。

          ## 課題・懸念点
          該当なし

          ## 動作確認
          - 自動生成されたPull Requestに差分が正しく含まれていることを確認。
          - 削除されたファイルが同期先でも削除されていることを確認。

          ## 受け入れ条件
          - [ ] 同期先のファイルが同期元と一致していること。
          - [ ] `synced/sync-info.json` に正しいコミットSHAが記録されていること。

          ## 参考ドキュメント
          - Conventional Commits 1.0.0: https://www.conventionalcommits.org/ja/v1.0.0/

          ## 補足
          自動生成されたPull Requestです。
          PR_BODY

            gh pr create \
              --title "ci: API側リポジトリからファイルを同期" \
              --body-file pr_body.txt \
              --head $BRANCH_NAME \
              --base main
          fi
