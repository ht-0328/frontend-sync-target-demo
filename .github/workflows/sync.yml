name: Sync from API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ht-0328/api-sync-source-demo
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source-repo
          sparse-checkout: sync-source/

      - name: Sync files
        run: |
          mkdir -p main-repo/synced/api/
          # 同期元のファイルを同期先にコピーし、不要なファイルは削除する
          rsync -av --delete source-repo/sync-source/ main-repo/synced/api/

          # 同期情報の生成に必要なコミットSHAを取得する
          cd source-repo
          COMMIT_SHA=$(git rev-parse HEAD)
          cd ../main-repo

          # 同期情報をJSONファイルとして記録する
          cat << 'JSON' > synced/sync-info.json
          {
            "repository": "ht-0328/api-sync-source-demo",
            "directory": "sync-source/",
            "commit_sha": "$COMMIT_SHA"
          }
          JSON
          sed -i "s/\$COMMIT_SHA/$COMMIT_SHA/" synced/sync-info.json

      - name: Create Pull Request if changes exist
        working-directory: main-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同期対象の変更がなければ、Pull Request は作成しない
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
          else
            echo "Changes detected, creating PR."

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # 同期用のブランチを作成する
            BRANCH_NAME="sync/api-$(date +'%Y%m%d%H%M%S')"
            git checkout -b $BRANCH_NAME

            # 同期されたファイルをコミットする
            git add synced/
            git commit -m "ci: API側リポジトリからの同期"

            # 作成したブランチを GitHub に push する
            git push --set-upstream origin "$BRANCH_NAME"

            # 既存の Pull Request テンプレートを使って PR を作成する
            gh pr create \
              --title "ci: API側リポジトリからファイルを同期" \
              --body-file .github/pull_request_template.md \
              --head "$BRANCH_NAME" \
              --base main
          fi
